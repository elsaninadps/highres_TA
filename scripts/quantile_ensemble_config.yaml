output_dir: models/quantile_ensemble_split_hpo

data:
  parquet_glob: data/training/*.pq
  talk_adjustment_csv: data/glodapv2_adjustments_last_updated_on_2026_07_09.csv
  target_name: talk
  coordinate_columns: [ expocode, time, lat, lon, depth ]
  quality_columns: [ talkqc, talkf ]
  non_null_columns: [ talk, salinity, temperature, nitrate, ssh_adt ]
  minimum_salinity: 20
  maximum_salinity: 40
  engineered_feature_names:
  - ncoord_x
  - ncoord_y
  - ncoord_z
  - dayofyear_sin
  - dayofyear_cos
  feature_names:
  - salinity
  - temperature
  - ssh_adt
  - nitrate
  - phosphate
  - silicate
  - bottomdepth
  - ncoord_x
  - ncoord_y
  - ncoord_z

model:
  linear_features: [ salinity ]
  polynomial_degree: 1
  quantiles: [ 0.1, 0.5, 0.9 ]
  maximum_iterations: 1000
  early_stopping_rounds: 50
  trial_thread_count: 12
  final_thread_count: -1

cross_validation:
  # One shared partition: block 0 always tests. Split k = 1..n_parts-1 validates on
  # block k and trains on the remaining n_parts-2 blocks. Hyperparameters are tuned by
  # leave-one-block-out CV over those training blocks, fixed for every replicate of a split.
  # split_random_state is independent of the member seeds so every member shares
  # the same held-out test block.
  n_parts: 7
  split_random_state: 42

optimization:
  n_trials: 100
  n_jobs: 5

evaluation:
  minimum_bottomdepth: 300
  intervals:
    80pct: [ 0.1, 0.9 ]

ensemble:
  aggregation: mean
  # HPO replicates r = 0..n-1 per split: independent Optuna studies (seed = 100 * split + r).
  n_hpo_replicates: 7
